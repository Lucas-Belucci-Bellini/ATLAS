[package]
name = "patina-dom"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
patina-core = { path = "../patina-core" }
patina-reactive = { path = "../patina-reactive" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "CharacterData",
    "Comment",
    "Document",
    "DocumentFragment",
    "Element",
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Node",
    "Text",
    "Window",
    "console",
] }
