name: Rust and WASM CI

on:
  push:
    branches: [main, "roadmap/**", "quality/**", "identity/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace (locked)
        run: cargo check --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wasm:
    name: Compile for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace for WASM
        run: cargo check --workspace --target wasm32-unknown-unknown --locked

  browser-smoke:
    name: WASM runtime in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ATLAS
        uses: actions/checkout@v4

      - name: Install stable Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build browser example
        run: wasm-pack build examples/hello-web --target web --out-dir pkg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: examples/hello-web
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the compiled example
        run: |
          python3 -m http.server 8000 --directory examples/hello-web > /tmp/atlas-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atlas-http.log
          exit 1

      - name: Test browser rendering and reactive interactions
        working-directory: examples/hello-web
        env:
          ATLAS_BASE_URL: http://127.0.0.1:8000
        run: node scripts/browser-smoke-test.cjs

  titan-http-contract:
    name: Live HTTP contract against TITAN
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ATLAS branch under review
        uses: actions/checkout@v4
        with:
          path: atlas
      - name: Checkout TITAN integration branch
        uses: actions/checkout@v4
        with:
          repository: Lucas-Belucci-Bellini/TITAN
          ref: identity/integration-contracts-2026-10
          path: titan
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run live HTTP contract against TITAN
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $titanPath = Join-Path $env:GITHUB_WORKSPACE "titan"
          $atlasSmoke = Join-Path $env:GITHUB_WORKSPACE "atlas/examples/hello-web/scripts/contract-smoke-test.ps1"
          $logOut = Join-Path $env:RUNNER_TEMP "titan.stdout.log"
          $logErr = Join-Path $env:RUNNER_TEMP "titan.stderr.log"
          $process = $null
          try {
            $process = Start-Process -FilePath "cargo" -ArgumentList @("run", "--locked", "-p", "ferrovia-server") -WorkingDirectory $titanPath -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($process.HasExited) {
                Get-Content $logOut -ErrorAction SilentlyContinue
                Get-Content $logErr -ErrorAction SilentlyContinue
                throw "TITAN encerrou antes de ficar pronto (exit code $($process.ExitCode))."
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:3000/api/v1/hello" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) {
              Get-Content $logOut -ErrorAction SilentlyContinue
              Get-Content $logErr -ErrorAction SilentlyContinue
              throw "TITAN não ficou pronto em 180 segundos."
            }
            Write-Host "TITAN respondeu; executando smoke test ATLAS no mesmo step para manter o servidor vivo."
            & $atlasSmoke -BaseUrl "http://127.0.0.1:3000"
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
              throw "Smoke test ATLAS falhou com exit code $LASTEXITCODE."
            }
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
